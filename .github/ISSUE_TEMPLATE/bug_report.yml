name: Bug report
description: Report something that is broken or unexpected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - docker-hub-pull-counter
        - GlobalPulse
        - trading-assistant
        - testcase-generator
        - .github / organization
        - other
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Node/runtime version, deploy target, etc.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs, links
